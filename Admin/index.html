<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Panel del administrador · Industrias Invictus Crane</title>
    <meta name="description" content="Panel del administrador de Industrias Invictus Crane.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1f1f1f">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('invictus_portal_theme');
                var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.classList.toggle('dark', dark);
            } catch (e) { /* almacenamiento bloqueado */ }
        })();
    </script>
    <link rel="stylesheet" href="dist/css/admin.css">
</head>
<body class="min-h-dvh">
<a href="#view" class="sr-only z-[70] rounded-lg bg-brand-600 px-4 py-2 font-semibold text-white focus:not-sr-only focus:fixed focus:left-4 focus:top-4">Saltar al contenido</a>

<div id="app" class="flex min-h-dvh">

    <aside id="sidebar" class="sidebar" aria-label="Menú del panel">
        <div class="sidebar-fx" aria-hidden="true">
            <div class="sidebar-grid"></div>
            <div class="sidebar-scan"></div>
        </div>

        <div class="flex items-center justify-between gap-3 px-5 pt-[max(1.5rem,env(safe-area-inset-top))] pb-5">
            <!-- El logotipo siempre regresa a «Mis datos» -->
            <a href="#/mis-datos" class="logo-link animate-fade-up" data-home data-sound="nav" title="Ir a Mis datos">
                <img src="assets/img/logo-invictus.png" alt="Industrias Invictus Crane · Mis datos" class="logo-img w-52 rounded-[8px]" width="1320" height="318" decoding="async">
            </a>
            <button type="button" class="icon-btn text-white/70 hover:bg-white/10 hover:text-white xl:hidden" data-close-sidebar data-sound="close" aria-label="Cerrar menú">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <p class="flex items-center gap-3 px-6 pb-3 font-display text-xs font-semibold uppercase tracking-[0.35em] text-white/45">
            <span class="h-px w-6 bg-neon shadow-[0_0_8px] shadow-neon"></span>Administración
        </p>

        <!-- Lo llena src/js/features/sidebar.js a partir de src/js/data/menu.js -->
        <nav id="nav" class="flex-1 space-y-1 overflow-y-auto px-3 pb-6 [scrollbar-width:thin] [scrollbar-color:rgb(255_255_255/.15)_transparent]"></nav>

        <div class="border-t border-white/10 px-4 pt-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
            <div class="user-card flex items-center gap-1 rounded-2xl bg-white/[.04] p-1.5 ring-1 ring-white/[.06]">
                <a href="#/mis-datos" class="flex min-w-0 flex-1 items-center gap-3 rounded-xl p-1 transition hover:bg-white/[.05]" data-home data-sound="nav" title="Ver mis datos">
                    <span id="userInitials" class="avatar grid size-10 shrink-0 place-items-center rounded-full bg-brand-700 font-display text-lg font-bold text-white">··</span>
                    <span class="min-w-0 flex-1 leading-tight">
                        <span id="userName" class="block truncate font-semibold text-white">Cargando…</span>
                        <span id="userRole" class="block truncate text-sm text-white/50">&nbsp;</span>
                    </span>
                </a>
                <button id="logoutBtn" type="button" class="icon-btn text-white/60 hover:bg-white/10 hover:text-white" aria-label="Cerrar sesión" title="Cerrar sesión">
                    <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
                </button>
            </div>
            <div class="mt-3 flex items-center justify-between gap-2 px-1 text-xs text-white/35">
                <span>Panel de administrador · v1.2</span>
                <!-- DEMOSTRACIÓN: quitar este botón al conectar el servidor real -->
                <button id="resetDemo" type="button" class="rounded px-1 underline-offset-2 transition hover:text-neon hover:underline">Datos de prueba</button>
            </div>
        </div>
    </aside>
    <div class="sidebar-backdrop" data-close-sidebar data-sound="close" aria-hidden="true"></div>

    <!-- ============ Área de trabajo ============ -->
    <div class="workspace flex min-h-dvh flex-col">
        <header class="topbar">
            <button type="button" class="menu-btn" id="menuBtn" data-sound="open" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
            </button>
            <div id="pageHeading" class="min-w-0 flex-1">
                <p id="pageEyebrow" class="eyebrow truncate"></p>
                <h1 id="pageTitle" class="page-title"></h1>
            </div>
            <div class="flex shrink-0 items-center gap-2 sm:gap-3">
                <!-- Silenciar / activar los sonidos del panel (src/js/features/sound-fx.js) -->
                <button id="soundToggle" type="button" class="sound-btn" aria-pressed="true" aria-label="Silenciar sonidos"></button>
                <button id="themeToggle" type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="Modo oscuro">
                    <span class="theme-knob">
                        <svg class="sun size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <svg class="moon size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
                    </span>
                </button>
            </div>
            <div class="led-strip" aria-hidden="true"></div>
        </header>

        <!-- Cada pantalla se dibuja aquí (src/js/views) -->
        <main id="view" class="@container mx-auto w-full max-w-[76rem] flex-1 px-4 pt-5 pb-[max(2rem,env(safe-area-inset-bottom))] sm:px-6 sm:pt-8 xl:px-10 xl:pt-10" tabindex="-1"></main>
    </div>
</div>

<div id="modalRoot"></div>
<div id="toastStack" class="fixed inset-x-4 bottom-[max(1.25rem,env(safe-area-inset-bottom))] z-[60] flex flex-col items-center gap-2 sm:inset-x-auto sm:right-6 sm:items-end" aria-live="polite"></div>

<script src="dist/js/admin.js"></script>
</body>
</html>
