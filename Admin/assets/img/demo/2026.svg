<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.blink{animation:b 1s steps(2,jump-none) infinite}@keyframes b{to{opacity:.15}}
.spark{animation:s .8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes s{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.float{animation:f 4s ease-in-out infinite}@keyframes f{50%{transform:translateY(-10px)}}
.dash{stroke-dasharray:10 10;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-40}}
.spin{animation:r 6s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes r{to{transform:rotate(360deg)}}
</style>
<defs><radialGradient id="bg" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#1f3a33"/><stop offset="1" stop-color="#141515"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#3fa684" stop-opacity=".35"/><stop offset="1" stop-color="#3fa684" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern></defs>
<rect width="800" height="500" fill="url(#bg)"/><rect width="800" height="500" fill="url(#grid)"/>
<ellipse cx="400" cy="300" rx="320" ry="180" fill="url(#glow)"/>
<rect y="420" width="800" height="80" fill="#0e1010"/><path d="M0 420H800" stroke="#218066" stroke-opacity=".6" stroke-width="3"/>
<rect x="300" y="90" width="200" height="320" rx="26" fill="#2b3836" stroke="#4a5654" stroke-width="6"/><rect x="316" y="114" width="168" height="270" rx="10" fill="#0f1414"/>
<g class="float"><path d="M350 190h14l16 70h66l14-50H372" stroke="#3fa684" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="388" cy="286" r="9" fill="#3fa684"/><circle cx="440" cy="286" r="9" fill="#3fa684"/></g>
<rect x="340" y="330" width="120" height="30" rx="8" fill="#218066"/><text x="400" y="351" text-anchor="middle" font-family="Arial" font-weight="700" font-size="15" fill="#fff">COMPRAR</text>
<g transform="translate(560 420)"><rect x="0" y="-80" width="90" height="80" fill="#b98b4e"/><path d="M0 -80H90M45 -80V0" stroke="#8c6532" stroke-width="5"/><rect x="100" y="-56" width="60" height="56" fill="#c99b5e"/></g>
