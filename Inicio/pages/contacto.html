<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | Industrias Invictus Crane</title>
    <meta name="description" content="Contáctanos por WhatsApp: Industrias Invictus Crane.">
    <meta name="theme-color" content="#141515">
    <link rel="icon" href="../assets/img/logo-invictus.png">
    <link rel="stylesheet" href="../dist/css/app.css">
    <script src="../dist/js/app.js" defer></script>
</head>

<body data-page="contacto" data-root="..">
    <main>
        <section class="page-hero">
            <img data-photo="pagina-contacto" class="page-hero-photo">
            <div class="page-hero-shade"></div>
            <div data-ambient data-sparks="8" class="absolute inset-0 -z-10"></div>
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <p class="eyebrow-led animate-fade-up">Hablemos</p>
                <h1 class="animate-fade-up [animation-delay:100ms]"><span class="neon-word">Contáctanos</span></h1>
                <p class="mt-5 max-w-2xl text-lg text-ink-300 animate-fade-up [animation-delay:200ms]">Escríbenos y te respondemos por WhatsApp.</p>
            </div>
        </section>

        <section class="relative z-10 -mt-12 pb-20">
            <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:px-8">
                <div class="neon-frame is-soft rounded-3xl bg-white p-8 shadow-2xl shadow-ink-900/10 ring-1 ring-ink-100 sm:p-12" data-reveal="zoom">
                    <form id="contactForm" class="flex flex-col gap-5">
                        <label class="field"><span>Nombre</span><input name="nombre" autocomplete="name" required></label>
                        <label class="field"><span>Correo</span><input name="correo" type="email" autocomplete="email" required></label>
                        <label class="field"><span>Mensaje</span><textarea name="mensaje" rows="5" required></textarea></label>
                        <button class="btn btn-primary" type="submit">Enviar por WhatsApp</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Ubicación: el mapa y los botones se generan desde src/js/core/location.js -->
        <section class="relative isolate overflow-hidden bg-white pb-24 pt-8">
            <div data-ambient="light" data-dots="10" data-sparks="6" class="absolute inset-0 -z-10"></div>
            <!-- La cuadrícula aparece poco a poco bajo el formulario, sin un corte -->
            <div class="pointer-events-none absolute inset-x-0 top-0 -z-10 h-40 bg-gradient-to-b from-white to-transparent"></div>
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex flex-wrap items-end justify-between gap-6" data-reveal>
                    <div>
                        <p class="eyebrow-led is-dark">Ubicación</p>
                        <h2 class="section-title mt-4">Dónde estamos</h2>
                    </div>
                    <p class="max-w-md text-lg text-ink-600">Visítanos en nuestra planta o escríbenos antes para agendar tu visita.</p>
                </div>
                <div data-location-map class="mt-10"></div>
            </div>
        </section>
    </main>
</body>

</html>
